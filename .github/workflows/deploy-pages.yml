name: Deploy Demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      V8_ROOT: /usr/local
      V8_ICU_DATA_DIR: /usr/local/share/v8
      LD_LIBRARY_PATH: /usr/local/lib
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-native-deps

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm ci

      - name: Configure release build
        run: |
          cmake --preset release \
            -DV8_INCLUDE_DIRS="/usr/local/include" \
            -DV8_LINK_DIRECTORIES="/usr/local/lib" \
            -DV8_LIBRARIES="v8;v8_libplatform;v8_libbase"

      - name: Build release engine
        run: cmake --build --preset release

      - name: Build static site
        env:
          CANVAS_ENGINE_BIN: ${{ github.workspace }}/build/release/canvas_engine
        run: bash scripts/build_pages.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
